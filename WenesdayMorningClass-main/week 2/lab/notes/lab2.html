<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF -8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!--linking .css files goes in the head tag-->
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div>
            <!--a generic container, no meaning by itself, used for styling and layout-->
    </div>
            <!--Semantic Tags-->
    <header>
            <!--top section of the page or a section, usually with a logo/title/intro-->
    </header>

    <nav>
        <!-- Contains navigation links,
         tells the browser/screen readers "this is the site menu"-->
    </nav>

    <main>
        <!--this is the bread and butter of your website-->
    </main>

    <section>
        <!--Sections tags will be inside the <main> Tags, group related content
            think of it like chapters in a book-->
    </section>

    <footer>
        <!-- bottom of the page or section, usally with copyright or contact info-->
    </footer>

    <ul>
        <!--unordered lists, bullets points-->
    </ul>

    <ol>
        <!--Ordered list, Numbered-->
    </ol>

    <li>
        <!--List Item-->
    </li>

    <table>
        <!--Table container-->
    </table>

    <tr>
        <!-- Table Row-->
    </tr>

    <th>
        <!--Table Header-->
    </th>

    <td>
        <!--Table Data-->
    </td>







</body>
