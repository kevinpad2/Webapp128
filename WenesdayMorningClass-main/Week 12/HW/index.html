<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dream Car submission website.</title> <!-- Fill in: page title -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Register Your Dream car!</h1> <!-- Fill in: heading text -->

  <form id="carForm"> <!-- Give your form an id -->
    <label for="name">Name:</label> <!-- Label text -->
    <input id="name" type="text" placeholder="Your name" required />

    <label for="email">Email:</label>
    <input id="email" type="email" placeholder="you@example.com" required />

    <label for="car">Dream car:</label>
    <input id="car" type="text" placeholder="Porsche 911 GT4 RS" required />
    
    <label for="age">Age:</label>
    <input id="age" type="number" min="0" max="105" placeholder="18" />
<!-- THis will ask what kind of car they pick gave them common options -->
    <label for="type">Car Type:</label>
        <select id="type">
            <option value="Sports Car">Sports Car</option>
            <option value="SUV">SUV</option>
            <option value="Muscle Car">Muscle Car</option>
            <option value="Luxury Car">Luxury Car</option>
        </select>
<!-- same code as car type but just a yes or no option -->
    <label for="modify">Would you modify your car?</label>
        <select id="modify">
            <option value="Yes">Yes</option>
            <option value="No">No</option>
        </select>


    <label for="message">Why is this your dream car?</label>
    <textarea id="message" rows="4" placeholder="Write something..."></textarea>

    <button type="submit">Click to submit</button> <!-- Button type and text -->
  </form>

  <section id="result"></section> <!-- Section to display results -->

  
  <script src="script.js"></script>
</body>
</html>
