<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forms lab</title> <!-- Fill in: page title -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Fill in your information</h1> <!-- Fill in: heading text -->

  <form id="contactForm"> <!-- Give your form an id -->
    <label for="name">Name:</label> <!-- Label text -->
    <input id="name" type="text" placeholder="Your name" required />

    <label for="email">Email:</label>
    <input id="email" type="email" placeholder="you@example.com" required />

    <label for="message">Message:</label>
    <textarea id="message" rows="4" placeholder="Write something..."></textarea>

    <button type="submit">Click to submit</button> <!-- Button type and text -->
  </form>

  <section id="result"></section> <!-- Section to display results -->

  <label for="age">Age:</label>
                <input id="age" type="number" min="0" max="105" placeholder="18" />

  <script src="scripts.js"></script>
</body>
</html>


<!-- Think about it questions
Id's give us a way to target the element from our javacript code. 

the <script> must be placed at the bottom of the body so that the html elements are loaded before the script runs. you can also use the defer and have it in your head tag instead

-->
